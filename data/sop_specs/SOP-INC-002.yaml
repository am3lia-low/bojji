# SOP-INC-002 — Foreign income and DTA relief
#
# Class: foreign_income_dta. ***HELD OUT — indexed: false*** (sop_design.md S5).
#
# Second WHOLE-CLASS HOLDOUT. As with INC-001, no indexed SOP declares
# `intents: [foreign_income_dta]`, so CLASS_TO_SOPS resolves EMPTY and the router
# derives `no_supporting_sop`.
#
# This holdout is the harder of the two, deliberately. SOP-RES-001 IS indexed and
# covers tax residency and the Certificate of Residence — and a COR exists
# precisely in order to claim DTA benefits. So a foreign-income email sits next to
# an indexed SOP that is adjacent but insufficient: the agent can say what a COR is
# and how to get one, but cannot say whether the citizen's foreign income is
# taxable or how DTA relief applies to it.
#
# RES-001 therefore carries an explicit `foreign_income_dta` entry in its
# `escalate_if` and in `not_in_scope`, so the seam is enforced by the corpus rather
# than left to the classifier's discretion. The near-miss is the point: an
# unanswerable case that looks answerable is a much stronger test than one that is
# obviously off-topic.

sop_id: SOP-INC-002
title: Foreign income and DTA relief
version: "1.0"
effective_date: 2026-01-01
supersedes: null
applies_to_ya: [2025, 2026]
intents: [foreign_income_dta]
indexed: false                    # HELD OUT — excluded from the index
owner_queue: IIT-General          # INVENTED — not a real IRAS queue
handling_target: 5_working_days   # ILLUSTRATIVE — not a real IRAS SLA
auto_reply_permitted: true
escalate_if:
  - account_specific
  - amount_computation_requested

references:
  - id: foreign_income
    url: https://www.iras.gov.sg/taxes/individual-income-tax/basics-of-individual-income-tax/what-is-taxable-what-is-not/income-received-from-overseas
    fetched: 2026-09-01
  - id: dta_relief
    url: https://www.iras.gov.sg/taxes/individual-income-tax/basics-of-individual-income-tax/tax-residency-and-tax-rates/claiming-exemptions-under-Avoidance-of-Double-Taxation-Agreements-(DTAs)
    fetched: 2026-09-01

scope: >
  Taxpayer asks whether income earned or received from overseas is taxable in
  Singapore, whether it must be declared, or how relief under an Avoidance of
  Double Taxation Agreement applies.

not_in_scope:
  - text: The taxpayer's own foreign income figures or assessment.
    route_to: account_specific
  - text: Computing tax or foreign tax credit for the taxpayer.
    route_to: amount_computation_requested
  - text: How to obtain a Certificate of Residence, and the residency test itself.
    route_to: residency                       # -> SOP-RES-001, which IS indexed

facts:
  - text: >
      Generally, overseas income received in Singapore, including overseas income
      deposited into a Singapore bank account, is not taxable, and overseas income
      that is not taxable does not need to be declared.
    source: foreign_income
  - text: >
      Overseas income is taxable in Singapore if it is received through
      partnerships based in Singapore.
    source: foreign_income
  - text: >
      Overseas income is taxable in Singapore if the overseas employment is
      incidental to the taxpayer's Singapore employment, such as where they travel
      abroad as part of their job.
    source: foreign_income
  - text: >
      Overseas income is taxable in Singapore where the taxpayer works in Singapore
      for a foreign employer.
    source: foreign_income
  - text: >
      Overseas income is taxable in Singapore where the taxpayer is employed
      overseas on behalf of the Singapore Government.
    source: foreign_income
  - text: >
      A Double Taxation Agreement is an agreement between Singapore and another
      jurisdiction that relieves double taxation of income earned in one
      jurisdiction by a resident of the other.
    source: dta_relief
  - text: >
      Under a DTA, jurisdictions may provide tax credits or exemptions to
      Singapore tax residents on income derived from their jurisdictions.
      Non-residents do not enjoy these benefits.
    source: dta_relief

decision_steps:
  - condition: Asking about their own foreign income figures or assessment
    action: Escalate
    reason: account_specific
  - condition: Asking IRAS to compute tax or a foreign tax credit
    action: Escalate
    reason: amount_computation_requested
  - condition: Asking only how to obtain a Certificate of Residence or about the residency test
    action: Route to SOP-RES-001
  - condition: Otherwise
    action: State the treatment of overseas income from the key facts

approved_phrasing:
  - id: general_rule
    text: >
      Generally, overseas income received in Singapore, including income deposited
      into a Singapore bank account, is not taxable, and you do not need to declare
      overseas income that is not taxable.
  - id: exceptions
    text: >
      Overseas income is taxable in Singapore in certain cases: where it is
      received through a partnership based in Singapore; where your overseas
      employment is incidental to your Singapore employment, such as travelling
      abroad as part of your job; where you work in Singapore for a foreign
      employer; or where you are employed overseas on behalf of the Singapore
      Government.
  - id: dta
    text: >
      A Double Taxation Agreement between Singapore and another jurisdiction
      relieves the double taxation of income earned in one jurisdiction by a
      resident of the other, and may provide a tax credit or exemption. These
      benefits are available to Singapore tax residents.

do_not:
  - Do not determine whether a particular taxpayer's foreign income is taxable —
    the exceptions turn on facts only an officer can establish.
  - Do not compute tax, foreign tax credit or relief amounts.
  - Do not interpret the terms of a specific Double Taxation Agreement.
  - Do not advise on the tax treatment in the foreign jurisdiction.

related:
  - SOP-RES-001   # tax residency and Certificate of Residence — INDEXED, adjacent
  - SOP-FIL-001   # declaring income in the return
