# SOP-PAY-002 — Payment channels, late-payment penalties and refunds
#
# Class: payment (auto_answerable). Second SOP in the `payment` group, so
# within-group selection by the drafter is measurable here (sop_design.md S6).
#
# NOTE: the penalty rules below are conjunctive and time-dependent — exactly the
# shape sop_design.md S11 forbids the agent from computing. The SOP states the
# rule; it never applies it to a taxpayer's figures.

sop_id: SOP-PAY-002
title: Payment channels, late-payment penalties and refunds
version: "1.0"
effective_date: 2026-01-01
supersedes: null
applies_to_ya: [2025, 2026]
intents: [payment]
indexed: true
owner_queue: IIT-Payments         # INVENTED — not a real IRAS queue
handling_target: same_day         # ILLUSTRATIVE — not a real IRAS SLA
auto_reply_permitted: true
escalate_if:
  - account_specific
  - hardship_or_waiver_request
  - amount_computation_requested

references:
  - id: late_payment
    url: https://www.iras.gov.sg/taxes/individual-income-tax/basics-of-individual-income-tax/receive-tax-bill-pay-tax-check-refunds/late-payment-or-non-payment-of-individual-income-tax
    fetched: 2026-09-01
  - id: how_to_pay
    url: https://www.iras.gov.sg/taxes/individual-income-tax/basics-of-individual-income-tax/receive-tax-bill-pay-tax-check-refunds/how-to-pay
    fetched: 2026-09-01
  - id: refunds
    url: https://www.iras.gov.sg/taxes/individual-income-tax/basics-of-individual-income-tax/receive-tax-bill-pay-tax-check-refunds/refunds
    fetched: 2026-09-01

scope: >
  Taxpayer asks when tax is due, how to pay, what penalties apply to late
  payment, what recovery action IRAS may take, or how and when refunds are made.

not_in_scope:
  - text: The taxpayer's own outstanding balance, penalty imposed, or refund status.
    route_to: account_specific
  - text: Asking for a penalty to be waived, or stating they cannot pay.
    route_to: hardship_or_waiver_request
  - text: Calculating a penalty or a balance for the taxpayer.
    route_to: amount_computation_requested

facts:
  - text: >
      The payment due date is 1 month from the date of the Notice of Assessment
      (tax bill).
    source: late_payment
  - text: >
      Unless the taxpayer is on an approved instalment plan, a 5% late payment
      penalty is imposed on unpaid tax where full payment is not received by the
      due date.
    source: late_payment
  - text: >
      If tax remains unpaid 60 days after the 5% late payment penalty is imposed,
      an additional penalty of 1% per month may be imposed for every completed
      month the tax remains unpaid, up to a maximum of 12% of the unpaid tax.
    source: late_payment
  - text: >
      Where tax is unpaid, IRAS may appoint agents — such as the taxpayer's bank,
      employer, tenant, or a lawyer handling the sale of their property — to
      recover the overdue tax.
    source: late_payment
  - text: >
      Where an assessment is revised downward, the late payment penalty is
      recalculated on the revised tax and any excess penalty is refunded.
    source: late_payment
  - text: >
      IRAS automatically refunds tax credits and pays interest on credits not
      refunded within 30 days from the date the tax credit arises.
    source: refunds
  - text: >
      Tax credits are refunded through GIRO, PayNow or Telegraphic Transfer.
    source: refunds
  - text: >
      IRAS has fully transitioned to electronic tax refunds and no longer issues
      cheques from 1 January 2026.
    source: refunds
  - text: >
      A taxpayer leaving Singapore who wishes to receive a refund before departure
      should maintain an active local SGD bank account registered for PayNow, and
      complete the steps at least 30 days prior to departure.
    source: refunds

decision_steps:
  - condition: Asking about their own balance, their own penalty, or where their refund is
    action: Escalate
    reason: account_specific
  - condition: Stating they cannot pay, or asking for a penalty to be waived or reduced
    action: Escalate
    reason: hardship_or_waiver_request
  - condition: Asking how much penalty they owe, or to compute a balance or refund
    action: Escalate
    reason: amount_computation_requested
  - condition: Otherwise
    action: State the rule from the key facts without applying it to their figures

approved_phrasing:
  - id: due_date
    text: >
      Tax is due 1 month from the date of your Notice of Assessment.
  - id: late_penalty
    text: >
      Unless you are on an approved instalment plan, a 5% late payment penalty is
      imposed on tax that is not paid in full by the due date. If the tax remains
      unpaid 60 days after that penalty is imposed, an additional penalty of 1%
      per month may be imposed for each completed month the tax remains unpaid,
      up to a maximum of 12% of the unpaid tax.
  - id: recovery
    text: >
      Where tax remains unpaid, IRAS may appoint agents such as your bank,
      employer or tenant to recover the overdue amount.
  - id: refunds
    text: >
      Tax credits are refunded automatically, through GIRO, PayNow or Telegraphic
      Transfer. Interest is paid on credits that are not refunded within 30 days
      of the date the credit arises. From 1 January 2026 IRAS no longer issues
      cheques, so please ensure your PayNow or GIRO details are up to date.

do_not:
  - Do not calculate a penalty, a balance, or a refund amount for the taxpayer.
  - Do not confirm whether a payment or refund has been received or processed.
  - Do not indicate whether a penalty will be waived — that is SOP-ESC-002.
  - Do not state a refund date for a specific taxpayer.

related:
  - SOP-PAY-001   # GIRO
  - SOP-ESC-002   # difficulty paying / waiver requests
  - SOP-ASM-001   # objecting to the assessment behind the amount
