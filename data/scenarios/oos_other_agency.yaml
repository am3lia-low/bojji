# Scenarios for the `oos_other_agency` class.
#
# Situations only. The generator never sees `label`, `source_sops` or this file's
# name -- see data/scenarios/README.md for why.
#
# OUT OF SCOPE -> auto-replies with a REDIRECT.
#
# Absorbs two kinds of misdirection that look different to a citizen but route
# identically: another tax type, and another agency entirely. The CPF boundary
# is the sharp one -- IRAS handles CPF RELIEF (a tax question); the CPF Board
# handles contributions, balances and withdrawals.

label: oos_other_agency
source_sops: [SOP-RTE-002]

scenarios:
  - scenario_id: OOSA-CPF-001
    situation: >
      Someone wants to know how much is being put into their retirement account
      each month and whether the rate has changed.
    persona: {role: employee, literacy: standard, register: polite}
    season: any
    computation_requested: false
    account_specific: false
    variants: 24
    notes: "CPF contribution rates -> CPF Board. Near REL-003."

  - scenario_id: OOSA-CPF-002
    situation: >
      A person wants to know when they can take money out of their retirement
      account.
    persona: {role: retiree, literacy: imperfect, register: polite}
    season: any
    computation_requested: false
    account_specific: false
    variants: 22
    notes: "CPF withdrawals -> CPF Board."

  - scenario_id: OOSA-GST-001
    situation: >
      Someone wants to know whether they need to register for the consumption
      tax now their turnover has grown.
    persona: {role: self_employed, literacy: standard, register: polite}
    season: any
    computation_requested: false
    account_specific: false
    variants: 22
    notes: "GST -> different tax type."

  - scenario_id: OOSA-PROP-001
    situation: >
      A person received a bill about the flat they own and is confused about
      which tax it is.
    persona: {role: employee, literacy: standard, register: anxious}
    season: any
    computation_requested: false
    account_specific: false
    variants: 22
    notes: "Property tax -> different tax type."

  - scenario_id: OOSA-STAMP-001
    situation: >
      Someone buying a property wants to know what duty is payable on the
      purchase.
    persona: {role: employee, literacy: standard, register: polite}
    season: any
    computation_requested: false
    account_specific: false
    variants: 19
    notes: "Stamp duty -> different tax type."

  - scenario_id: OOSA-IR21-001
    situation: >
      An employer wants to know what they must do before a foreign employee
      leaves the country.
    persona: {role: employee, literacy: standard, register: polite}
    season: any
    computation_requested: false
    account_specific: false
    variants: 22
    notes: "Tax clearance IR21 -> employer obligation."

  - scenario_id: OOSA-MOM-001
    situation: >
      Someone in a dispute with their employer over unpaid salary wants to know
      how to take it further.
    persona: {role: employee, literacy: imperfect, register: frustrated}
    season: any
    computation_requested: false
    account_specific: false
    variants: 19
    notes: "Employment dispute -> MOM."

