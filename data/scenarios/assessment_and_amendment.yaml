# Scenarios for the `assessment_and_amendment` class.
#
# Situations only. The generator never sees `label`, `source_sops` or this file's
# name -- see data/scenarios/README.md for why.
#
# TIE-BREAK: anything DISPUTING THE FIGURES in an assessment
# is this class, including an estimated NOA raised for late filing. `filing`
# covers only how and when to submit. Scenarios here are written to sit
# clearly on the disputing side of that line.

label: assessment_and_amendment
source_sops: [SOP-ASM-001]

#
# Now also carries the account-specific situations that used to be their own
# class. Being account-specific is a property, not a topic: the `account_specific`
# FLAG escalates them at router reason 5, before confidence is consulted, so the
# classifier is asked for the topic and nothing else.
scenarios:

  - scenario_id: ASM-TYPE-001
    situation: >
      Someone received a document headed with a word in brackets they do not recognise, and wants to know what kind of bill it is.
    persona: {role: employee, literacy: standard, register: polite}
    season: noa
    computation_requested: false
    account_specific: false
    variants: 31
    notes: Original / Amended / Additional / Estimated.

  - scenario_id: ASM-TYPE-002
    situation: >
      A person got a second bill after already receiving one, showing a higher amount, and does not understand why there are two.
    persona: {role: employee, literacy: standard, register: anxious}
    season: noa
    computation_requested: false
    account_specific: false
    variants: 25
    notes: NOA (Additional) after withdrawal of reliefs.

  - scenario_id: ASM-AMEND-001
    situation: >
      Someone believes the notice they received does not reflect something they
      told the authority, and wants to know the procedure for having the notice
      itself revised, and by when they must ask.
    persona: {role: employee, literacy: standard, register: polite}
    season: noa
    computation_requested: false
    account_specific: false
    variants: 30
    notes: >
      Sharpened: the previous wording led with a missing claim, which is
      relief vocabulary, and 32 of 33 went to `tax_reliefs`. The
      distinguishing fact is the amendment PROCEDURE and its deadline, not
      what the claim was for.

  - scenario_id: ASM-AMEND-002
    situation: >
      A person wants to know how long they have to object after receiving a bill they disagree with.
    persona: {role: employee, literacy: standard, register: polite}
    season: noa
    computation_requested: false
    account_specific: false
    variants: 25
    notes: 30 days from the date on the bill.

  - scenario_id: ASM-PAY-001
    situation: >
      Someone has objected to their bill and wants to know whether they still have to pay while it is being looked at.
    persona: {role: employee, literacy: standard, register: anxious}
    season: noa
    computation_requested: false
    account_specific: false
    variants: 30
    notes: >
      THE TRAP: payment is NOT deferred by an objection.

  - scenario_id: ASM-YA-001
    situation: >
      A person is confused that a bill dated this year appears to be about money they earned last year.
    persona: {role: employee, literacy: imperfect, register: polite}
    season: noa
    computation_requested: false
    account_specific: false
    variants: 22
    notes: Year of Assessment vs preceding calendar year.

  - scenario_id: ASM-EST-001
    situation: >
      Someone who did not submit anything received a bill with a figure that seems far too high, and wants to challenge it.
    persona: {role: self_employed, literacy: standard, register: frustrated}
    season: noa
    computation_requested: false
    account_specific: false
    variants: 25
    notes: >
      TIE-BREAK CASE: disputing an estimated NOA is THIS class.

  - scenario_id: ASM-COMP-001
    situation: >
      A person disagrees with their bill, lists what they think the correct figures are, and asks to be told the revised amount.
    persona: {role: employee, literacy: standard, register: frustrated}
    season: noa
    computation_requested: true
    account_specific: false
    variants: 22
    notes: Recomputation request.

  - scenario_id: ASM-ACCT-001
    situation: >
      Someone submitted an amendment weeks ago and wants to know whether it has been dealt with.
    persona: {role: employee, literacy: standard, register: anxious}
    season: noa
    computation_requested: false
    account_specific: true
    plant_pii: [nric]
    variants: 25
    notes: Objection status requires a lookup.

  - scenario_id: ACCT-NOA-001
    situation: >
      Someone is looking at a figure on their own bill and cannot work out what it
      refers to.
    persona: {role: employee, literacy: standard, register: anxious}
    season: any
    computation_requested: false
    account_specific: true
    plant_pii: [nric]
    variants: 35
    notes: Was its own class. Topic is the content of an assessment.

  - scenario_id: ASM-DUE-001
    situation: >
      A person has just received their notice and wants to confirm by when they
      must settle it, asking where on the notice that date is stated and what the
      other dates printed beside it refer to.
    persona: {role: employee, literacy: standard, register: polite}
    season: noa
    computation_requested: false
    account_specific: false
    variants: 15
    notes: >
      Moved from `payment`. The question IS about when to pay -- that is kept,
      not written out -- but the notice states its own due date on its face, so
      it is answered by reading the document. An earlier rewrite dropped the
      payment question entirely and made this class artificially easy at
      `filing`'s expense. Previously scored 0.00 under `payment`: every email
      opened by naming the bill, and the model called it assessment.

  - scenario_id: ASM-COMP-002
    situation: >
      Someone gives the amount on their bill and how late they are, and asks to be told exactly what they now owe in total.
    persona: {role: employee, literacy: standard, register: frustrated}
    season: noa
    computation_requested: true
    account_specific: false
    variants: 15
    notes: >
      Moved from `payment`. Recomputing a balance is out of scope for
      every SOP here -- `computation_requested` escalates it at router
      reason 4 before confidence is read -- so the class only decides
      which queue it lands in, and the figures come off the notice.
