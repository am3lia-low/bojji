# Scenarios for the `account_specific` class.
#
# Situations only. The generator never sees `label`, `source_sops` or this file's
# name -- see data/scenarios/README.md for why.
#
# ALWAYS ESCALATES (bucket: requires_account_lookup).
#
# These scenarios are also what the `account_specific` BACKSTOP FLAG is
# measured against. The hard cases are deliberately included: emails whose
# topical vocabulary points at another class, where only a possessive gives
# the game away. Those are exactly the ones the classifier is expected to
# miss and the flag is expected to catch.

label: account_specific
source_sops: [SOP-ESC-001]

scenarios:
  - scenario_id: ACCT-NOA-001
    situation: >
      Someone is looking at a figure on their own bill and cannot work out what
      it refers to.
    persona: {role: employee, literacy: standard, register: anxious}
    season: noa
    computation_requested: false
    account_specific: true
    plant_pii: [nric]
    variants: 22
    notes: "Own assessment figures."

  - scenario_id: ACCT-REFUND-001
    situation: >
      A person is waiting for money back that has not arrived and wants to know
      what is happening with it.
    persona: {role: employee, literacy: standard, register: frustrated}
    season: noa
    computation_requested: false
    account_specific: true
    plant_pii: [nric, phone]
    variants: 21
    notes: "Vocabulary points at `payment`; only 'my' distinguishes it."

  - scenario_id: ACCT-GIRO-001
