# Scenarios for the `rental_income` class.
#
# Situations only. The generator never sees `label`, `source_sops` or this file's
# name -- see data/scenarios/README.md for why.
#
# ***HELD-OUT CLASS*** -- SOP-INC-001 is authored but NOT indexed, so
# CLASS_TO_SOPS['rental_income'] resolves EMPTY and the router derives
# `no_supporting_sop`.
#
# The classifier must still predict this class, so scenarios and labels exist
# as normal. These are ordinary citizen questions squarely inside individual
# income tax; the system simply has no procedure for them. An agent that
# answers from general tax knowledge has failed the test this holdout sets.

label: rental_income
source_sops: [SOP-INC-001]

scenarios:

  - scenario_id: RENT-TAX-001
    situation: >
      Someone letting out a spare room wants to know whether the rent they receive has to be declared.
    persona: {role: employee, literacy: standard, register: polite}
    season: filing
    computation_requested: false
    account_specific: false
    variants: 50
    notes: >
      Unanswerable: no indexed SOP.

