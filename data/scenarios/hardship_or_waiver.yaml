# Scenarios for the `hardship_or_waiver` class.
#
# Situations only. The generator never sees `label`, `source_sops` or this file's
# name -- see data/scenarios/README.md for why.
#
# ALWAYS ESCALATES (bucket: high_consequence).
#
# Consequence and discretion: the writer is in financial distress and the
# outcome turns on their circumstances. No confidence score should be able to
# authorise an automated answer here.

label: hardship_or_waiver
source_sops: [SOP-ESC-002]

scenarios:
  - scenario_id: HARD-CANT-001
    situation: >
      Someone has lost their job and cannot pay the bill they have just
      received.
    persona: {role: employee, literacy: standard, register: anxious}
    season: noa
    computation_requested: false
    account_specific: false
    plant_pii: [nric]
    variants: 22
    notes: "Plain inability to pay."

  - scenario_id: HARD-CANT-002
    situation: >
      A self-employed person whose business has collapsed owes more than they
      can find and is asking for help.
    persona: {role: self_employed, literacy: imperfect, register: anxious}
    season: any
    computation_requested: false
    account_specific: false
    variants: 18
    notes: "Business failure."

  - scenario_id: HARD-PLAN-001
    situation: >
      Someone wants to spread what they owe over a longer period than they were
