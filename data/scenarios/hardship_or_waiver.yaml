    persona: {role: employee, literacy: standard, register: polite}
    season: noa
    computation_requested: false
    account_specific: false
    variants: 18
    notes: "Longer payment plan request."

  - scenario_id: HARD-WAIVE-001
    situation: >
      A person was charged extra for paying late and is asking for that charge
      to be removed, explaining they were in hospital.
    persona: {role: retiree, literacy: standard, register: anxious}
    season: noa
    computation_requested: false
    account_specific: false
    variants: 22
    notes: "Penalty waiver on medical grounds."

  - scenario_id: HARD-WAIVE-002
    situation: >
      Someone who missed a deadline while caring for a dying relative is asking
