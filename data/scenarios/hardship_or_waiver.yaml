    persona: {role: retiree, literacy: imperfect, register: anxious}
    season: any
    computation_requested: false
    account_specific: false
    plant_pii: [nric]
    variants: 18
    notes: "Ongoing medical hardship."

  - scenario_id: HARD-RETRENCH-001
    situation: >
      Someone made redundant mid-year is worried about a bill based on the
