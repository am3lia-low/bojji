    persona: {role: employee, literacy: standard, register: anxious}
    season: any
    computation_requested: false
    account_specific: false
    variants: 18
    notes: "Composition waiver, bereavement."

  - scenario_id: HARD-MED-001
    situation: >
      A person undergoing long-term treatment cannot keep up with instalments
