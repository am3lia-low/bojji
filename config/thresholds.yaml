# PER-BUCKET ESCALATION THRESHOLDS
#
# The escalation policy, readable in one file and diffable in git. Changing a
# number here changes system behaviour without touching code, which is the point:
# an operator should be able to argue with this file.
#
# THRESHOLDS ARE PER BUCKET, NOT PER CLASS. The bucket determines the action, so it
# is also the level at which an operator should set policy. The 646-email calibration
# split supplies the development evidence; the 877-email test split is held back for
# one independent report.
#
# Only two of the five thresholds actually bite. Three buckets escalate regardless
# of confidence, so their value is recorded for completeness and never consulted.
#
# STATUS: FITTED. Chosen on the calibration split against the 10-class classifier
# and the fitted temperature in models/classifier/calibration.json. No test result
# was read to set either value.
#
# The two thresholds that bite are set INDEPENDENTLY, because the two buckets do
# not behave alike. Measured on the 646-email calibration split:
#
#     threshold   auto_answerable            out_of_scope
#                 automated  risk            automated  risk
#       0.55          222    0.419                31    0.161
#       0.58          n/a      n/a                23    0.000
#       0.90           64    0.109                 0      n/a
#       0.93           34    0.088                 0      n/a
#       0.94           21    0.000                 0      n/a
#
# For substantive answers, 0.93 is the first value on the declared 0.01 grid to
# meet the <=10% development-risk target. For redirects, the harm is asymmetric,
# so 0.58 is the first value with zero observed development errors. On the untouched
# test split these frozen values yield 11.6% coverage at 1.0% risk.

selection:
  split: calibration
  n: 646
  grid_min: 0.01
  grid_max: 0.99
  grid_step: 0.01
  test_consulted: false
  criteria:
    auto_answerable: "first cutoff with empirical risk <= 0.10"
    out_of_scope: "first cutoff with zero observed errors"

buckets:
  auto_answerable:
    threshold: 0.93
    bites: true
    justification: >
      The only bucket where the agent asserts substantive tax content to a citizen,
      so this is the threshold that governs the coverage/error trade-off and the one
      the risk-coverage curve is swept over. Selected on the calibration split, on
      a predeclared 0.01 grid, as the first cutoff meeting the <=10% empirical-risk
      target: 34 items were automated, with 3 errors (8.8%). The small denominator
      is reported rather than hidden; a real deployment would need substantially
      more labelled mail before widening coverage.

  out_of_scope:
    threshold: 0.58
    bites: true
    justification: >
      Redirects auto-reply, so a low-confidence redirect sends a citizen to the
      wrong agency -- a visible, citizen-facing failure rather than an internal one.
      Selected independently on the calibration split as the first 0.01-grid value
      with zero observed redirect errors: 23 items were automated. The asymmetry is
      deliberate -- a wrong redirect is harder for a citizen to recover from than a
      wrong-but-grounded answer, because it sends them to an organisation that cannot
      help and has no record of them.

  requires_account_lookup:
    threshold: 1.0
    bites: false
    justification: >
      Never auto-replies. Answering requires reading a specific taxpayer's record,
      which the agent cannot do and must not guess at. Recorded as 1.0 for
      completeness; the router escalates on the bucket before any threshold is
      consulted.

  high_consequence:
    threshold: 1.0
    bites: false
    justification: >
      Never auto-replies. Financial distress and active fraud carry consequences no
      confidence score should be permitted to authorise an automated answer for.
      Recorded as 1.0 for completeness; never consulted.

  no_supporting_sop:
    threshold: 1.0
    bites: false
    justification: >
      Never auto-replies, and derived rather than hand-mapped: the class resolved
      to no indexed SOP, so there is nothing to ground a reply on. Recorded as 1.0
      for completeness; never consulted.

# The risk-coverage curve is generated by sweeping a global multiplier over every
# threshold above, using the real router rather than a reimplementation of it, so
# the curve cannot drift from the system it describes.
sweep:
  multiplier_min: 0.2
  multiplier_max: 2.0
  steps: 37
