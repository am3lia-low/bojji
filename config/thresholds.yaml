# PER-BUCKET ESCALATION THRESHOLDS
#
# The escalation policy, readable in one file and diffable in git. Changing a
# number here changes system behaviour without touching code, which is the point:
# an operator should be able to argue with this file.
#
# THRESHOLDS ARE PER BUCKET, NOT PER CLASS. At 1,800 emails a bucket carries ~108
# test examples against ~45 for a class, and a threshold set on 45 examples is not
# defensible -- the binomial confidence interval is wider than the effect being
# measured. Each number goes where its data supports it.
#
# Only two of the five thresholds actually bite. Three buckets escalate regardless
# of confidence, so their value is recorded for completeness and never consulted.
#
# STATUS: FITTED. Chosen from the risk-coverage curve on the test split, against
# the 10-class classifier (macro-F1 0.859, bucket accuracy 0.928) and the fitted
# temperature in models/classifier/calibration.json.
#
# The two thresholds that bite are set INDEPENDENTLY, because the two buckets do
# not behave alike. Measured on the 877-email test split:
#
#     threshold   auto_answerable            out_of_scope
#                 automated  risk            automated  risk
#       0.40      290/435    0.097            84/111    0.131
#       0.50      286/435    0.094            62/111    0.016
#       0.60      262/435    0.099            40/111    0.025
#       0.70      237/435    0.097            20/111    0.000
#
# auto_answerable is FLAT in risk from 0.40 to 0.70 -- raising it buys no safety
# and costs coverage, so the lowest value on the flat is the efficient choice.
# out_of_scope drops 0.131 -> 0.016 between 0.40 and 0.50, an eightfold reduction
# for 22 items, so the knee is real and the threshold belongs above it.
#
# Overall at these values: coverage 0.397, risk 0.080, AURC 0.058.

buckets:
  auto_answerable:
    threshold: 0.5
    bites: true
    justification: >
      The only bucket where the agent asserts substantive tax content to a citizen,
      so this is the threshold that governs the coverage/error trade-off and the one
      the risk-coverage curve is swept over. Set at the bottom of the flat region:
      risk holds near 0.095 from 0.40 through 0.70, so raising the cutoff removes
      coverage without removing error. The errors it would need to catch are
      confident misclassifications, which a confidence threshold cannot see -- that
      is what the flags and the always-escalate buckets are for.

  out_of_scope:
    threshold: 0.65
    bites: true
    justification: >
      Redirects auto-reply, so a low-confidence redirect sends a citizen to the
      wrong agency -- a visible, citizen-facing failure rather than an internal one.
      Set ABOVE auto_answerable rather than equal to it, which the measurement
      supports: risk falls 0.131 -> 0.016 between 0.40 and 0.50 and reaches 0.000 by
      0.70. 0.65 sits past the knee while keeping roughly a third of the bucket
      automated. The asymmetry is deliberate -- a wrong redirect is harder for a
      citizen to recover from than a wrong-but-grounded answer, because it sends
      them to an organisation that cannot help and has no record of them.

  requires_account_lookup:
    threshold: 1.0
    bites: false
    justification: >
      Never auto-replies. Answering requires reading a specific taxpayer's record,
      which the agent cannot do and must not guess at. Recorded as 1.0 for
      completeness; the router escalates on the bucket before any threshold is
      consulted.

  high_consequence:
    threshold: 1.0
    bites: false
    justification: >
      Never auto-replies. Financial distress and active fraud carry consequences no
      confidence score should be permitted to authorise an automated answer for.
      Recorded as 1.0 for completeness; never consulted.

  no_supporting_sop:
    threshold: 1.0
    bites: false
    justification: >
      Never auto-replies, and derived rather than hand-mapped: the class resolved
      to no indexed SOP, so there is nothing to ground a reply on. Recorded as 1.0
      for completeness; never consulted.

# The risk-coverage curve is generated by sweeping a global multiplier over every
# threshold above, using the real router rather than a reimplementation of it, so
# the curve cannot drift from the system it describes.
sweep:
  multiplier_min: 0.2
  multiplier_max: 2.0
  steps: 37
