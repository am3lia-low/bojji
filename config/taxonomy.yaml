# THE TAXONOMY -- 12 classes, 5 routing buckets.
#
# GENERATED by scripts/derive_taxonomy.py from data/sop/*.md. Do not edit.
#
# This file is a PROJECTION of the corpus, not a source. The runtime derives the
# same maps from SOP frontmatter at startup (src/triage/sop/index.py), so there is
# one source of truth and no file here to fall out of date. This copy exists to
# make the taxonomy readable and diffable in one place, and to give training and
# evaluation a stable list of class names.
#
# To change routing behaviour, edit the SOP spec and regenerate. That is the point
# of the design: escalation policy lives in the corpus, so an agency conforming
# real internal SOPs to this schema changes behaviour with no code change.
#
# Regenerate:  python scripts/generate_sops.py && python scripts/derive_taxonomy.py

classes:
  assessment_and_amendment:
    bucket: auto_answerable
    sops:
    - SOP-ASM-001
    auto_reply_permitted: true
    escalate_if:
    - account_specific
    - computation_requested
    - hardship_or_waiver
    - scam_report
    indexed: true
  filing:
    bucket: auto_answerable
    sops:
    - SOP-FIL-001
    auto_reply_permitted: true
    escalate_if:
    - account_specific
    - computation_requested
    - hardship_or_waiver
    - scam_report
    indexed: true
  foreign_income_dta:
    bucket: no_supporting_sop
    sops: []
    auto_reply_permitted: false
    escalate_if:
    - no_supporting_sop
    indexed: false
    held_out_sop: SOP-INC-002
    note: Authored but excluded from the index, so this class is genuinely unanswerable and
      the router derives no_supporting_sop.
  hardship_or_waiver:
    bucket: high_consequence
    sops:
    - SOP-ESC-002
    auto_reply_permitted: false
    escalate_if:
    - account_specific
    - computation_requested
    - hardship_or_waiver
    indexed: true
  oos_redirect:
    bucket: out_of_scope
    sops:
    - SOP-RTE-001
    - SOP-RTE-002
    auto_reply_permitted: true
    escalate_if:
    - account_specific
    - computation_requested
    - scam_report
    indexed: true
  payment:
    bucket: auto_answerable
    sops:
    - SOP-PAY-001
    - SOP-PAY-002
    auto_reply_permitted: true
    escalate_if:
    - account_specific
    - computation_requested
    - hardship_or_waiver
    - scam_report
    indexed: true
  rental_income:
    bucket: no_supporting_sop
    sops: []
    auto_reply_permitted: false
    escalate_if:
    - no_supporting_sop
    indexed: false
    held_out_sop: SOP-INC-001
    note: Authored but excluded from the index, so this class is genuinely unanswerable and
      the router derives no_supporting_sop.
  residency:
    bucket: auto_answerable
    sops:
    - SOP-RES-001
    auto_reply_permitted: true
    escalate_if:
    - account_specific
    - computation_requested
    - foreign_income_dta
    - scam_report
    indexed: true
  scam_report:
    bucket: high_consequence
    sops:
    - SOP-ESC-003
    auto_reply_permitted: false
    escalate_if:
    - account_specific
    - scam_report
    indexed: true
  tax_reliefs:
    bucket: auto_answerable
    sops:
    - SOP-REL-001
    - SOP-REL-002
    - SOP-REL-003
    - SOP-REL-004
    auto_reply_permitted: true
    escalate_if:
    - account_specific
    - computation_requested
    - scam_report
    indexed: true
buckets:
  auto_answerable:
    classes:
    - assessment_and_amendment
    - filing
    - payment
    - residency
    - tax_reliefs
    rationale: Draft a reply if calibrated confidence clears the threshold. These are the
      only classes where the agent asserts substantive tax content.
  requires_account_lookup:
    classes: []
    rationale: Always escalate. Answering requires reading a specific taxpayer's record, which
      the agent cannot do and must not guess at.
  high_consequence:
    classes:
    - hardship_or_waiver
    - scam_report
    rationale: Always escalate regardless of confidence. Financial distress and active fraud
      carry consequences no confidence score should be permitted to authorise an automated
      answer for.
  out_of_scope:
    classes:
    - oos_redirect
    rationale: 'Auto-reply with a redirect, never a guess. The redirect is an automated action
      and counts toward coverage: under the no-back-door policy a clean redirect is the correct
      outcome, not a failure.'
  no_supporting_sop:
    classes:
    - foreign_income_dta
    - rental_income
    rationale: 'Always escalate. Derived, not hand-mapped: the class resolves to no indexed
      SOP, so the emptiness of the lookup is itself the signal.'
labels:
- assessment_and_amendment
- filing
- foreign_income_dta
- hardship_or_waiver
- oos_redirect
- payment
- rental_income
- residency
- scam_report
- tax_reliefs
